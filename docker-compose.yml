# Menjalankan seluruh sistem: docker compose up --build
#   API          http://localhost:3000/api/v1
#   Swagger UI   http://localhost:8081
#   PostgreSQL   localhost:5433 (dari komputer host)

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-sipasdos}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Skema dimuat otomatis hanya saat volume database pertama kali dibuat.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: SIPASDOS
      APP_PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-sipasdos}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:?isi JWT_SECRET di file .env (openssl rand -hex 32)}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-24}
    ports:
      - "3000:3000"
    restart: unless-stopped

  swagger:
    image: swaggerapi/swagger-ui
    environment:
      SWAGGER_JSON: /docs/openapi.yaml
    volumes:
      - ./docs:/docs:ro
    ports:
      - "8081:8080"
    restart: unless-stopped

volumes:
  pgdata:
